---
name: CI
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "**/*.nix"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "crates/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run tests in Nix CI shell
        run: nix develop .#ci --command cargo nextest run --workspace --features integration --profile ci

      - name: Upload the nextest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          # nextest resolves the configured junit path under its profile store.
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

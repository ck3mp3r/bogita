[package]
name = "bogita-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
integration = []

[dependencies]
bogita-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
ssh-key = { version = "0.6", features = ["ed25519"] }

[dev-dependencies]
bogita-core = { path = "../core", features = ["test-support"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
chrono = "0.4"
uuid = { version = "1.24", features = ["v4"] }
ssh-key = { version = "0.6", features = ["ed25519"] }
